version: '3.8'

services:
  newe:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    volumes:
      - ./assets/config:/app/assets/config
      - ./assets/runtime:/app/assets/runtime
      - ./upload:/app/upload
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - newe-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: newe123
      MYSQL_DATABASE: newe
      MYSQL_USER: neweuser
      MYSQL_PASSWORD: newe123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - newe-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - newe-network

volumes:
  mysql_data:
  redis_data:

networks:
  newe-network:
    driver: bridge